<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Echo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; position: relative;
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0; animation: float 10s infinite ease-in-out alternate; }
        .orb-1 { width: 300px; height: 300px; background: rgba(139, 92, 246, 0.6); top: 10%; left: 20%; }
        .orb-2 { width: 250px; height: 250px; background: rgba(6, 182, 212, 0.5); bottom: 15%; right: 20%; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.1); } }
        .glass-card {
            position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 40px 30px;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.4); border-radius: 24px; box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
        }
        .lang-toggle {
            position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2); color: rgba(255, 255, 255, 0.8);
            padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; backdrop-filter: blur(5px); transition: all 0.3s;
        }
        .lang-toggle:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
        h2 { color: #ffffff; text-align: center; font-size: 22px; font-weight: 600; margin-bottom: 8px; letter-spacing: 1px; margin-top: 10px; }
        p.subtitle { color: rgba(255, 255, 255, 0.6); text-align: center; font-size: 13px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; position: relative; }
        .input-group label { display: block; color: rgba(255, 255, 255, 0.8); font-size: 13px; margin-bottom: 6px; padding-left: 5px; }
        .input-group input, .input-group textarea {
            width: 100%; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 12px 14px; color: #fff; font-size: 15px; outline: none; transition: all 0.3s ease;
        }
        .input-group input::placeholder, .input-group textarea::placeholder { color: rgba(255, 255, 255, 0.3); }
        .input-group input:focus, .input-group textarea:focus {
            background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.5); box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .captcha-group { display: flex; align-items: center; gap: 10px; }
        .captcha-group input { width: 100px; text-align: center; }
        .captcha-text { color: #00ffcc; font-weight: bold; font-size: 16px; }
        button[type="submit"] {
            width: 100%; background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px; padding: 14px; color: #ffffff;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px); margin-top: 10px;
        }
        button[type="submit"]:hover { background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 100%); box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
        button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #result { text-align: center; margin-top: 15px; font-size: 13px; color: #00ffcc; min-height: 20px; transition: color 0.3s; }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-card">
        <button class="lang-toggle" id="langBtn">EN / 中</button>
        <h2 id="title">Connect with Me</h2>
        <p class="subtitle" id="subtitle">Please leave your contact info</p>
        
        <form id="contactForm">
            <!-- Web3Forms 配置 -->
            <input type="hidden" name="access_key" value="ea2f1c95-46be-4d60-96a5-09b1272b5265">
            <input type="hidden" name="subject" value="New Contact from Echo-From-The-Void">
            <input type="hidden" name="from_name" value="Echo Contact Form">
            
            <div class="input-group">
                <label id="lbl-wechat">WeChat</label>
                <input type="text" name="WeChat" id="ph-wechat" placeholder="Your WeChat ID">
            </div>
            <div class="input-group">
                <label id="lbl-whatsapp">WhatsApp</label>
                <input type="tel" name="WhatsApp" id="ph-whatsapp" placeholder="+86 138 0000 0000">
            </div>
            <div class="input-group">
                <label id="lbl-facebook">Facebook</label>
                <input type="text" name="Facebook" id="ph-facebook" placeholder="Your FB account or URL">
            </div>
            <div class="input-group">
                <label id="lbl-phone">Phone</label>
                <input type="tel" name="Phone" id="ph-phone" placeholder="Your phone number">
            </div>
            <div class="input-group">
                <label id="lbl-remark">Remark (Optional)</label>
                <textarea name="Remark" rows="2" id="ph-remark" placeholder="Anything else..."></textarea>
            </div>
            
            <div class="input-group captcha-group">
                <label id="lbl-captcha" style="width:100%;">Verification:</label>
                <input type="number" id="captchaInput" required placeholder="?">
                <span class="captcha-text" id="captchaQuestion"></span>
            </div>
            
            <button type="submit" id="submitBtn">Submit</button>
            <div id="result"></div>
        </form>
    </div>

<script>
    // 双语语言包
    const translations = {
        en: {
            title: "Connect with Me", subtitle: "Please leave your contact info",
            lblWechat: "WeChat", phWechat: "Your WeChat ID",
            lblWhatsapp: "WhatsApp", phWhatsapp: "+86 138 0000 0000",
            lblFacebook: "Facebook", phFacebook: "Your FB account or URL",
            lblPhone: "Phone", phPhone: "Your phone number",
            lblRemark: "Remark (Optional)", phRemark: "Anything else...",
            lblCaptcha: "Verification:", btnSubmit: "Submit", btnSubmitting: "Submitting...",
            errEmpty: "Please fill in at least one contact method!",
            errCaptcha: "Incorrect verification code!",
            errCooldown: "You have submitted recently. Please try again 24 hours later.",
            msgSuccess: "Success! I will contact you soon.",
            msgFail: "Failed. Please try again.", msgNetErr: "Network error. Please try later."
        },
        zh: {
            title: "联系我", subtitle: "请留下您方便的联系方式",
            lblWechat: "微信", phWechat: "您的微信号",
            lblWhatsapp: "WhatsApp", phWhatsapp: "+86 138 0000 0000",
            lblFacebook: "Facebook", phFacebook: "您的 FB 账号或主页链接",
            lblPhone: "手机号", phPhone: "请填写您的手机号码",
            lblRemark: "备注信息 (选填)", phRemark: "其他想说的话...",
            lblCaptcha: "防刷验证:", btnSubmit: "提交联系方式", btnSubmitting: "正在提交...",
            errEmpty: "请至少填写一种联系方式！",
            errCaptcha: "验证码错误！",
            errCooldown: "您近期已提交过，请 24 小时后再试。",
            msgSuccess: "提交成功！我会尽快联系您。",
            msgFail: "提交失败，请刷新重试。", msgNetErr: "网络异常，请稍后再试。"
        }
    };

    let currentLang = localStorage.getItem('siteLang') || 'en'; // 默认英文
    const langBtn = document.getElementById('langBtn');
    const result = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    const captchaInput = document.getElementById('captchaInput');
    const captchaQuestion = document.getElementById('captchaQuestion');
    let currentCaptchaAnswer = 0;

    // 生成验证码
    function generateCaptcha() {
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        currentCaptchaAnswer = num1 + num2;
        captchaQuestion.innerText = `${num1} + ${num2} =`;
        captchaInput.value = '';
    }

    // 应用语言
    function applyLanguage(lang) {
        const t = translations[lang];
        document.getElementById('title').innerText = t.title;
        document.getElementById('subtitle').innerText = t.subtitle;
        document.getElementById('lbl-wechat').innerText = t.lblWechat;
        document.getElementById('ph-wechat').placeholder = t.phWechat;
        document.getElementById('lbl-whatsapp').innerText = t.lblWhatsapp;
        document.getElementById('ph-whatsapp').placeholder = t.phWhatsapp;
        document.getElementById('lbl-facebook').innerText = t.lblFacebook;
        document.getElementById('ph-facebook').placeholder = t.phFacebook;
        document.getElementById('lbl-phone').innerText = t.lblPhone;
        document.getElementById('ph-phone').placeholder = t.phPhone;
        document.getElementById('lbl-remark').innerText = t.lblRemark;
        document.getElementById('ph-remark').placeholder = t.phRemark;
        document.getElementById('lbl-captcha').innerText = t.lblCaptcha;
        document.getElementById('submitBtn').innerText = t.btnSubmit;
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        localStorage.setItem('siteLang', lang);
    }

    // 切换语言按钮
    langBtn.addEventListener('click', () => {
        currentLang = currentLang === 'en' ? 'zh' : 'en';
        applyLanguage(currentLang);
    });

    // 初始化
    applyLanguage(currentLang);
    generateCaptcha();

    // 表单提交
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const t = translations[currentLang];

        // 检查24小时冷却
        const lastSubmit = localStorage.getItem('lastSubmitTime');
        const now = Date.now();
        if (lastSubmit && (now - lastSubmit < 24 * 60 * 60 * 1000)) {
            result.style.color = "#ff6b6b";
            result.innerHTML = t.errCooldown;
            return;
        }

        // 检查验证码
        if (parseInt(captchaInput.value) !== currentCaptchaAnswer) {
            result.style.color = "#ff6b6b";
            result.innerHTML = t.errCaptcha;
            generateCaptcha();
            return;
        }

        // 检查是否至少填了一项联系方式
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData);
        if (!data.WeChat && !data.WhatsApp && !data.Facebook && !data.Phone) {
            result.style.color = "#ff6b6b";
            result.innerHTML = t.errEmpty;
            return;
        }

        submitBtn.innerText = t.btnSubmitting;
        submitBtn.disabled = true;
        result.innerHTML = "";

        // 移除验证码字段，防止发到邮件里太乱
        delete data.captchaInput;

        try {
            // 向 Web3Forms 发送请求
            const response = await fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const json = await response.json();

            if (response.status === 200) {
                result.style.color = "#00ffcc";
                result.innerHTML = t.msgSuccess;
                e.target.reset();
                generateCaptcha();
                localStorage.setItem('lastSubmitTime', Date.now());
            } else {
                console.error(json);
                result.style.color = "#ff6b6b";
                result.innerHTML = t.msgFail;
            }
        } catch (error) {
            result.style.color = "#ff6b6b";
            result.innerHTML = t.msgNetErr;
        } finally {
            submitBtn.innerText = t.btnSubmit;
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
